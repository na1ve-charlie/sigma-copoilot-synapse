report_contract: RecognitionReport
cases:
  - message: 查找最近一周不合格记录
    focus: search action + time/result slot operations
    expected_report:
      verdict: clear
      requires_confirmation: false
      degraded: false
      action_intents:
        - name: task.nvh.record_search
      slot_operations:
        - entity_type: time_range
          action: replace
          target: 最近一周
          slot_valid: true
        - entity_type: summary_result
          action: replace
          target: fail
          slot_valid: true
      diagnostics: {}

  - message: 导出 A 型号的原始数据
    focus: origin data export action + product slot
    expected_report:
      verdict: clear
      requires_confirmation: false
      degraded: false
      action_intents:
        - name: task.nvh.origin_data_export
      slot_operations:
        - entity_type: product_type
          action: replace
          target: A
          slot_valid: true
      diagnostics: {}

  - message: Vib1 或 Vib2 任意一个不合格
    focus: preserve AnyOf semantics as atomic recognition output
    expected_report:
      verdict: clear
      requires_confirmation: false
      degraded: false
      action_intents: []
      slot_operations:
        - entity_type: sensor
          action: replace
          target:
            - Vib1
            - Vib2
          slot_valid:
            - true
            - true
        - entity_type: filter_operator
          action: replace
          target: any
          slot_valid: true
        - entity_type: summary_result
          action: replace
          target: fail
          slot_valid: true
      diagnostics: {}

  - message: 删除上面这些数据
    focus: delete action + active-selection reference
    expected_report:
      verdict: clear
      requires_confirmation: false
      degraded: false
      action_intents:
        - name: task.nvh.data_delete
      slot_operations:
        - entity_type: selection_reference
          action: replace
          target: active_selection
          slot_valid: true
      diagnostics: {}

  - message: 先备份这些数据，然后删除本地原始数据
    focus: ordered backup and delete actions sharing the same selection reference
    expected_report:
      verdict: clear
      requires_confirmation: false
      degraded: false
      action_intents:
        - name: task.nvh.data_backup
        - name: task.nvh.data_delete
      slot_operations:
        - entity_type: selection_reference
          action: replace
          target: active_selection
          slot_valid: true
      diagnostics: {}
