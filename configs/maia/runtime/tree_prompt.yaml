template: |
  /no_think
  Classify user message into intent(s).

  ## Intent Tree
  {tree_text}
  {resolver_section}
  ## Entity Types
  Allowed entity_type values: {entity_types}
  {examples_section}
  ## User Message
  "{message}"

  ## Output Format
  Output ONLY valid JSON, nothing else. Each intent is a flat object (no nested "slots"):
  {{"intents": [{{"intent": "name", "score": 0.0-1.0, "action": "", "entity_type": "", "target": "", "slot_valid": true}}]}}

  ## Fields
  - intent: must exactly match a name from the Intent Tree.
  - score: confidence 0.0-1.0.
  - action: "add"|"remove"|"replace"|""; empty if no slot operation.
  - entity_type: one of the allowed entity_type values or "".
  - target: canonical entity value or "".
  - slot_valid: true if target matches a known value, false otherwise.

  ## Rules
  - 1 action = 1 element in the intents array.
  - Preserve the user's action order.
  - Context change plus observation/query should output both intents.
  - A bare entity reference inside an observation request should stay on the observation intent as slot fields when possible.
  - Resolver query intents ask for available candidates; use empty action, entity_type, and target for them.
  - Never invent intent names. Use only exact names from the Intent Tree.
  - Never output removed legacy intent names such as "task.nvh.data_export".
  - For task.nvh.origin_data_export, output empty action, entity_type, and target. H5 and TDMS are task parameters handled after intent recognition, not Themis slots.
  - For task.nvh.excel_export, output empty action, entity_type, and target. Sensor list and one/two/result data types are task parameters handled after intent recognition, not Themis slots.
  - For task.nvh.data_backup and task.nvh.data_delete, ALWAYS output empty action, entity_type, and target. "Backup" and "delete" describe terminal task operations, never Themis slot actions; do not encode deletion as action="remove", and do not map artifact names to data_kind, archive_status, or any other entity_type. Data types and backup file name are task parameters handled after intent recognition.
  - For task.nvh.audio.generate, output empty action, entity_type, and target. NG audio generation filters NG records inside the task handler, not as Themis slots.
  - For task.nvh.data_observation.view_indicator_result, output empty action, entity_type, and target. Indicator domain, sensor list, test segment list, and indicator are task parameters handled after intent recognition, not Themis slots.
  - Do not use data_kind for export requests. data_kind is only for record-search filtering.

examples_path: "tree_prompt_examples.yaml"

example_rendering:
  max_examples: 9
  group_selection: "message_aware"
