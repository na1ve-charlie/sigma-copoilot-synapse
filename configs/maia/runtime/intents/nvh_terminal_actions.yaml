intents:
- name: task.nvh.record_search
  domain: nvh.search
  embed_text: 查找记录, 查询记录, 搜索数据, 找不合格记录, 查最近的数据, record search
  tree_text: 用户想按当前或新给出的筛选条件查询记录列表，不是在请求导出、删除、报告、音频或重计算。
- name: task.nvh.origin_data_export
  domain: nvh.data_export
  embed_text: 导出原始数据, 导出 TDMS, 导出 H5 原始数据, raw data export, 下载原始测试文件
  tree_text: 用户想导出当前筛选范围内的原始测试数据文件。只有原始数据、raw data、TDMS、H5 原始文件应匹配；导出 Excel、下载报告、生成音频、导出结果数据或查询记录不应匹配。
- name: task.nvh.excel_export
  domain: nvh.data_export
  embed_text: 导出 Excel, 导出一维数据到 Excel, 导出二维数据 Excel, 导出结果数据 Excel, 下载 Excel, single station report export
  tree_text: 用户想把当前筛选范围内的记录导出为 Excel 或单站报表数据。Excel 导出可以包含传感器列表、一维数据、二维数据、结果数据等任务参数；这些参数由应用层 task handler 二次解析，不作为 Themis slot。导出原始数据、TDMS、H5 原始文件、下载报告、生成音频或只查询记录不应匹配。
- name: task.nvh.data_backup
  domain: nvh.data_management
  embed_text: 备份数据, 先备份, backup data, 备份这些记录, 备份当前结果
  tree_text: 用户想备份当前选择的数据，可与删除组合成有序复合意图。区分：单纯导出不应匹配备份。
- name: task.nvh.data_delete
  domain: nvh.data_management
  embed_text: 删除数据, 删掉这些数据, 清理当前数据, delete data, 删除本地原始数据
  tree_text: 用户想删除当前选择的数据。区分：删除数据集、删除配置或普通查询不应匹配这里。
- name: task.nvh.data_observation.view_indicator_result
  domain: nvh.data_observation
  embed_text: 查看指标结果, 查看结果数据, 查看某个指标, 看指标图, 观察数据, 看一维指标, 看时间域, 看频谱, 看阶次谱, 看阶次切片, 看倒谱, 看心理声学, observation result
  tree_text: 用户想查看结果数据、指标结果、指标图或某个数据观察结果。指标域包括一维指标、时间域、频谱、阶次谱、阶次切片、倒谱、心理声学。不要尝试抽取指标域、传感器、测试段或指标名；这些都由应用层 DataObservationHandler 作为 task params 解析。区分：趋势、记录列表查询、报告、导出、音频和重计算不是该观察任务。
- name: task.nvh.data_observation.indicator_trend_analysis.trend
  domain: nvh.data_observation
  embed_text: 看趋势, 指标趋势, RMS趋势, trend, 变化曲线, 趋势图
  tree_text: 用户想查看指标在当前范围内的变化趋势。区分：频谱观察、质量统计和报告生成。
- name: task.nvh.report.download
  domain: nvh.report
  embed_text: 下载报告, 导出报告, report download, 把报告下下来, 获取现成报告
  tree_text: 用户想下载已经存在的报告，不是生成新报告或导出原始数据。
- name: task.nvh.report.generate
  domain: nvh.report
  embed_text: 生成报告, 创建报告, report generation, 出一份报告, 新建分析报告
  tree_text: 用户想基于当前范围生成新的报告，不是下载已有报告或直接导出数据。
- name: task.nvh.audio.generate
  domain: nvh.audio
  embed_text: 生成音频, 导出音频, audio generation, 听一下这些数据, 做成声音
  tree_text: 用户想把当前范围的数据生成音频结果，不是查看频谱、导出原始数据或下载报告。
- name: task.nvh.colormap.recompute
  domain: nvh.recompute
  embed_text: 重算声彩图, 重算彩图, colormap recompute, 重建声彩图, 重新计算彩图
  tree_text: 用户想重新计算当前范围关联的声彩图结果。区分：普通查询、导出和报告生成。
