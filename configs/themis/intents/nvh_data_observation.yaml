intents:

- name: task.nvh.data_observation.indicator_query.list
  domain: nvh.data_observation
  embed_text: 指标列表, 可用指标, 支持哪些指标, indicator list, 有哪些指标
  tree_text: 用户想查看当前观察范围下可用指标列表，不是查询单个指标值或趋势。

- name: task.nvh.data_observation.indicator_trend_analysis.trend
  domain: nvh.data_observation
  embed_text: 指标趋势, RMS趋势, 最近变化, 随时间变化, 变化曲线, indicator trend
  tree_text: 用户想查看指标随时间、样本或观察范围的变化趋势。区分：NG率趋势和合格率趋势属于质量统计。

# One-dim Data Observation
- name: task.nvh.data_observation.batch.one_dim_data
  domain: nvh.data_observation
  embed_text: 一维指标，一维RMS，一维均方根，ONED_DATA，切换测试段看一维指标，切换传感器看一维数据
  tree_text: 用户想查看一维指标数据。和测试段/传感器切换同句出现时，因作为观察动作单独输出

# Time-domain Data Observation
- name: task.nvh.data_observation.batch.time_domain
  domain: nvh.data_observation
  embed_text: 时域数据, 时间域数据, 时域指标, 时间域指标, time domain, 时域波形, 时域曲线, 原始时域, 切换测试段看时域数据
  tree_text: 用户想查看传感器时域数据、时间域数据或波形。和测试段/传感器切换同句出现时，仍应作为观察动作单独输出。

# Frequency-domain Data Observation
- name: task.nvh.data_observation.batch.frequency_spectrum
  domain: nvh.data_observation
  embed_text: 频谱, 看频谱, 查看频谱, spectrum, TWO_D_FS, 频谱数据, 频谱图, 传感器频谱, 切换测试段看频谱
  tree_text: 用户想查看普通频谱数据。和测试段/传感器切换同句出现时，仍应作为观察动作单独输出。区分：阶次谱应匹配阶次谱；倒谱、倒频谱、倒阶次谱应匹配倒谱。

# Order-domain Data Observation
- name: task.nvh.data_observation.batch.order_spectrum
  domain: nvh.data_observation
  embed_text: 阶次谱, order spectrum, 阶次谱图, order map, 传感器阶次谱
  tree_text: 用户想查看普通阶次谱。询问"什么是阶次谱"是业务咨询，不应触发该任务。区分：倒阶次谱应匹配倒谱。

- name: task.nvh.data_observation.batch.order_slice
  domain: nvh.data_observation
  embed_text: 阶次切片, order slice, 2Ord, 二阶切片, 某个阶次
  tree_text: 用户想查看某个阶次或阶次切片。区分：完整阶次谱应匹配阶次谱。

- name: task.nvh.data_observation.batch.cepstrum
  domain: nvh.data_observation
  embed_text: 倒谱, 倒频谱, 倒阶次谱, cepstrum, 倒谱图, 查看倒谱, 查看倒频谱, 查看倒阶次谱
  tree_text: 用户想查看倒谱、倒频谱或倒阶次谱数据。即使表达里包含“频谱”或“阶次谱”，只要带“倒”，应匹配倒谱任务；普通频谱、普通阶次谱、阶次切片和时域数据才匹配各自观察任务。
- name: task.nvh.data_observation.batch.psychoacoustics
  domain: nvh.data_observation
  embed_text: 心理声学, psychoacoustics, 响度, 尖锐度, 粗糙度, 抖动强度
  tree_text: 用户想查看心理声学指标或心理声学数据。区分：普通频谱、阶次谱和时域数据应匹配各自观察任务。

- name: task.nvh.data_observation.exceeded_indicator_analysis.list
  domain: nvh.data_observation
  embed_text: 超限指标, 超限项, 超标指标, 不合格项, exceeded indicators
  tree_text: 用户想查看当前范围内超限或不合格指标列表。区分：某个超限项详情应匹配超限详情。

- name: task.nvh.data_observation.exceeded_indicator_analysis.detail
  domain: nvh.data_observation
  embed_text: 超限详情, 超限项详情, 为什么超限, 为什么超标, exceeded indicator detail
  tree_text: 用户想查看某个超限指标的详情或原因。区分：超限列表应匹配查询超限指标。

- name: task.nvh.data_observation.quality_statistics.pass_rate
  domain: nvh.data_observation
  embed_text: 合格率, 良率, 通过率, pass rate, 查询合格率
  tree_text: 用户想查看当前范围的合格率或良率。区分：NG率是不良率，合格率趋势是变化趋势。

- name: task.nvh.data_observation.quality_statistics.pass_rate_trend
  domain: nvh.data_observation
  embed_text: 合格率趋势, 良率走势, 通过率趋势, pass rate trend, 合格率变化
  tree_text: 用户想查看合格率随时间或样本范围的趋势。区分：单个指标趋势应匹配指标趋势。

- name: task.nvh.data_observation.quality_statistics.ng_rate
  domain: nvh.data_observation
  embed_text: NG率, 不良率, 不合格率, NG rate, 查询NG率
  tree_text: 用户想查看当前范围的不良率或 NG 率。区分：合格率是通过率，NG率趋势是变化趋势。
