intents:
  - name: task.nvh.context_management.clear_context
    domain: nvh.context_management
    embed_text: 清空上下文 清除上下文 重置上下文 清空当前任务 清除当前参数 重置会话 clear context reset context /clear
    tree_text: 用户想清空当前会话内的业务上下文，包括槽位、当前任务、暂停任务和待确认状态；应保留 Workspace Context。

  - name: inquiry.nvh.context_management.current
    domain: nvh.context_management
    embed_text: 当前上下文 当前筛选条件 现在的数据范围 当前查的是什么 当前传感器和测试段 当前观察范围
    tree_text: 用户想查看当前 Context 中维护的筛选条件，不应触发业务查询，也不应修改 Context。

  - name: task.nvh.context_management.switch_data_type
    domain: nvh.context_management
    embed_text: 切换数据类型 数据类型换成 原始数据 processed 频谱 阶次谱 倒谱 倒频谱 倒阶次谱 时域数据
    tree_text: 数据类型切换属于 Context 筛选条件修改，应复用当前上下文并写入数据类型维度。倒谱、倒频谱、倒阶次谱都应写入倒谱数据类型。

  - name: task.nvh.context_management.switch_sensor
    domain: nvh.context_management
    embed_text: 切换传感器 传感器换成 加上传感器 不看传感器 sensor_1 sensor01 S1 S2
    tree_text: 传感器切换属于 Context 筛选条件修改，应复用当前上下文并写入传感器维度。

  - name: task.nvh.context_management.switch_test_segment
    domain: nvh.context_management
    embed_text: 切换测试段 测试段换成 怠速段 加速段 巡航段 cruise idle Spd-rDL Spd-rCH
    tree_text: 测试段切换属于 Context 筛选条件修改，应复用当前上下文并写入测试段维度。

  - name: task.nvh.context_management.switch_indicator
    domain: nvh.context_management
    embed_text: 切换指标 指标换成 只看指标 RMS 峰值 peak 均方根
    tree_text: 指标切换属于 Context 筛选条件修改，应复用当前上下文并写入指标维度。
