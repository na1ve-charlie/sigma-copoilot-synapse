cases:
  - message: "你好"
    expected: "chat.nvh.capabilities"
    note: "能力说明 / 闲聊"

  - message: "你能做什么"
    expected: "chat.nvh.capabilities"
    note: "询问能力"

  - message: "当前筛选条件是什么"
    expected: "inquiry.nvh.context_management.current"
    note: "查看当前上下文"

  - message: "有哪些传感器"
    expected: "inquiry.nvh.resolver_query.sensors"
    note: "Resolver 候选查询"

  - message: "有哪些传感器、测试段"
    expected:
      - "inquiry.nvh.resolver_query.sensors"
      - "inquiry.nvh.resolver_query.test_segments"
    note: "Resolver 候选查询：传感器 + 测试段"

  - message: "有哪些传感器、测试段、指标"
    expected:
      - "inquiry.nvh.resolver_query.sensors"
      - "inquiry.nvh.resolver_query.test_segments"
      - "inquiry.nvh.resolver_query.indicators"
    note: "Resolver 候选查询：传感器 + 测试段 + 指标"

  - message: "有哪些指标"
    expected: "inquiry.nvh.resolver_query.indicators"
    note: "Resolver 候选查询"

  - message: "传感器换成 VibX"
    expected: "task.nvh.context_management.switch_sensor"
    slots: {action: "replace", entity_type: "sensor", target: "VibX"}
    note: "传感器上下文切换"

  - message: "测试段换成 Spd-rDL"
    expected: "task.nvh.context_management.switch_test_segment"
    slots: {action: "replace", entity_type: "test_segment", target: "Spd-rDL"}
    note: "测试段上下文切换"

  - message: "指标换成 RMS"
    expected: "task.nvh.context_management.switch_indicator"
    slots: {action: "replace", entity_type: "indicator", target: "RMS"}
    note: "指标上下文切换"

  - message: "查看频谱"
    expected: "task.nvh.data_observation.batch.frequency_spectrum"
    note: "普通频谱观察"

  - message: "查看阶次谱"
    expected: "task.nvh.data_observation.batch.order_spectrum"
    note: "阶次谱观察"

  - message: "查看阶次切片"
    expected: "task.nvh.data_observation.batch.order_slice"
    note: "阶次切片观察"

  - message: "查看时域数据"
    expected: "task.nvh.data_observation.batch.time_domain"
    note: "时域观察"

  - message: "看 RMS 趋势"
    expected: "task.nvh.data_observation.indicator_trend_analysis.trend"
    note: "指标趋势"

  - message: "哪些指标超限"
    expected: "task.nvh.data_observation.exceeded_indicator_analysis.list"
    note: "超限列表"

  - message: "为什么 RMS 超限"
    expected: "task.nvh.data_observation.exceeded_indicator_analysis.detail"
    note: "超限详情"

  - message: "合格率是多少"
    expected: "task.nvh.data_observation.quality_statistics.pass_rate"
    note: "合格率"

  - message: "合格率趋势"
    expected: "task.nvh.data_observation.quality_statistics.pass_rate_trend"
    note: "合格率趋势"

  - message: "NG 率是多少"
    expected: "task.nvh.data_observation.quality_statistics.ng_rate"
    note: "NG 率"

  - message: "创建数据集"
    expected: "task.nvh.data_management.dataset.create"
    note: "数据管理：创建"

  - message: "从文件导入数据集"
    expected: "task.nvh.data_management.dataset.import"
    note: "数据管理：导入"

  - message: "删除数据集"
    expected: "task.nvh.data_management.dataset.delete"
    note: "数据管理：删除"

  - message: "切换到 Spd-rDL 看频谱"
    expected:
      - "task.nvh.context_management.switch_test_segment"
      - "task.nvh.data_observation.batch.frequency_spectrum"
    slots:
      - {action: "replace", entity_type: "test_segment", target: "Spd-rDL"}
      - {}
    note: "复合意图：切换测试段 + 观察"
