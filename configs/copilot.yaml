assistant:
  id: "sigma-copilot"
  display_name: "Sigma Copilot"

recognition:
  intents_path: "themis/intents"
  tree_prompt_path: "themis/tree_prompt.yaml"
  llm:
    model: "qwen/qwen3-4b-2507"
    base_url: "http://localhost:1234/v1"
    api_key: "svcopilot local accessor"
  themis:
    alpha: 0.10
    delta: 0.10
    min_intent_score: 0.50
    build_index_on_init: true

includes:
  actions:
    - "actions/*.yaml"
  slots:
    - "slots/*.yaml"
  resolvers:
    - "resolvers/*.yaml"

sigma:
  base_url: "http://192.168.0.65:8081"
  default_lang: "zh"
  timeout: 5.0
  token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJjcmVhdGVUaW1lIjoxNzgxMDU5NjE2LCJyZWZyZXNoVGltZSI6MTc4MzY1MTYxNiwiZXhwIjoxNzgxMTQ2MDE2LCJ1c2VybmFtZSI6Im95c3EifQ.qEzifIgOPdxmYiJbzS3GFrQB7oAfYtUYUHExJM5JJ6s"

dataset_materializer:
  save_dataset:
    path: "/api/storage/dataGroup/saveDataGroup"
    method: "POST"
  query_records:
    path: "/api/storage/singleStationReport/listReportByMulti"
    method: "GET"
    params:
      page: 1
      rows: 500
  replace_records:
    path: "/api/storage/dataGroup/saveSelectedResult"
    method: "POST"

workspace_filters:
  products:
    kind: "product_tuple"
    required: true
  test_time:
    kind: "time"
    required: false

storage:
  sqlite_path: ".copilot/copilot_state.sqlite3"

reply_routes:
  chat_llm:
    strategy: "llm"
    system_prompt: "你是 Sigma Copilot。用户当前提问已被识别为聊天或能力咨询类意图，请直接回答，不要解释内部识别过程。"
    usage_guide:
      - "查看频谱：可以先切换传感器和测试段，例如“切换到加速段，只看 sensor_1”，再说“查看频谱”。"
      - "查询候选值：可以问“有哪些传感器”“有哪些测试段”“有哪些指标”。"
      - "查看当前上下文：可以问“当前筛选条件是什么”。"
      - "普通咨询：可以直接问 NVH 分析、指标含义或系统能力。"
default_reply_route: "chat_llm"

reply_intents:
  chat.nvh.capabilities: "chat_llm"
  free_chat: "chat_llm"
