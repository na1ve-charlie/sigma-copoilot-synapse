[project]
name = "sigma-copilot-app"
version = "0.1.0"
description = "Business Copilot kernel built on Themis intent recognition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "themis",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maia*"]

[tool.uv.sources]
themis = { path = "../themis", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external or cross-component integration",
    "domain_data_observation: data observation domain tests",
    "v1: v1 behavior tests",
]
