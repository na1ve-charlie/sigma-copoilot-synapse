<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigMA Copilot</title>
<style>
/* ============================================================
   Sigma Maia — Chat UI Design System
   Premium Light — Apple / Linear inspired aesthetic
   ============================================================ */

:root {
  /* ── Palette ── */
  --bg-root:       #F3F3F6;
  --bg-sidebar:    #F9F9FB;
  --bg-main:       #FCFCFD;
  --bg-card:       #FFFFFF;
  --bg-card-hover: #F7F7FA;
  --bg-bubble-user:#5865F2;
  --bg-input:      #FFFFFF;
  --bg-chip:       #ECECF2;
  --bg-chip-hover: rgba(88,101,242,0.08);
  --bg-option:     #F7F7FC;
  --bg-option-hover:#EEEFF8;
  --bg-option-selected: rgba(88,101,242,0.06);

  --border-subtle: #E4E4ED;
  --border-card:   #EBEBF2;
  --border-hover:  #CFCFDC;
  --border-active: #5865F2;

  --accent:        #5865F2;
  --accent-glow:   rgba(88,101,242,0.18);
  --success:       #22C55E;
  --warning:       #F59E0B;
  --danger:        #EF4444;

  --text-primary:  #19191E;
  --text-secondary:#696978;
  --text-tertiary: #9B9BAA;
  --text-inverse:  #FFFFFF;

  /* ── Typography ── */
  --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
  --letter-spacing: -0.01em;

  /* ── Spacing ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  /* ── Shadows ── */
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-glow: 0 0 20px rgba(88,101,242,0.18);
  --shadow-danger: 0 0 16px rgba(239,68,68,0.20);

  /* ── Layout ── */
  --sidebar-width: 260px;
  --topbar-height: 44px;
  --input-height: 64px;

  /* ── Transitions ── */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  font-size: 14px;
  letter-spacing: var(--letter-spacing);
  color: var(--text-primary);
  background: var(--bg-root);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.18); }

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  transition: margin-left 250ms var(--ease-out), opacity 250ms var(--ease-out);
  z-index: 10;
}
#sidebar.collapsed {
  margin-left: calc(-1 * var(--sidebar-width));
  opacity: 0;
  pointer-events: none;
}
.sidebar-header {
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  color: var(--text-primary);
}
.sidebar-logo svg { width: 24px; height: 24px; }
.sidebar-logo span { background: linear-gradient(135deg, #5865F2, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-new-chat {
  width: calc(100% - 32px);
  margin: 0 16px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: rgba(88,101,242,0.07);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 150ms var(--ease-out), transform 150ms var(--ease-out);
}
.btn-new-chat:hover { background: rgba(88,101,242,0.13); transform: translateY(-1px); }
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.session-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  transition: background 150ms var(--ease-out);
  position: relative;
}
.session-item:hover { background: rgba(0,0,0,0.04); }
.session-item.active {
  background: rgba(88,101,242,0.06);
  color: var(--text-primary);
}
.session-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 16px;
  background: var(--accent);
  border-radius: 2px;
}
.session-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-time { font-size: 10px; color: var(--text-tertiary); flex-shrink: 0; margin-left: 8px; }
.btn-delete-session {
  opacity: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--text-tertiary);
  font-size: 14px;
  transition: opacity 150ms, color 150ms;
  flex-shrink: 0;
}
.session-item:hover .btn-delete-session { opacity: 1; }
.btn-delete-session:hover { color: var(--danger); background: rgba(239,68,68,0.08); }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-tertiary);
}
.sidebar-footer .avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5865F2, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white;
}

/* ── Main ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-main);
}

/* ── Topbar ── */
#topbar {
  height: var(--topbar-height);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.btn-toggle-sidebar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: background 150ms, color 150ms;
}
.btn-toggle-sidebar:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
.topbar-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
.topbar-dots { margin-left: auto; display: flex; gap: 6px; }
.topbar-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--border-subtle); }

/* ── Chat Area ── */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
/* Welcome state */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding-bottom: 80px;
}
.welcome-icon { width: 56px; height: 56px; margin-bottom: 8px; }
.welcome h2 { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.welcome p { font-size: 14px; color: var(--text-secondary); max-width: 400px; line-height: 1.6; }

/* ── Input Area ── */
#input-area {
  padding: 0 20px 20px;
  flex-shrink: 0;
  position: relative;
}
#input-area::before {
  content: '';
  position: absolute;
  top: -40px; left: 0; right: 0; height: 40px;
  background: linear-gradient(transparent, var(--bg-main) 70%);
  pointer-events: none;
}
.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 6px 6px 6px 18px;
  box-shadow: var(--shadow-card);
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.input-wrapper:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88,101,242,0.10), var(--shadow-card);
}
#message-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text-primary);
  padding: 8px 0;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
}
#message-input::placeholder { color: var(--text-tertiary); }
.btn-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 150ms, transform 150ms, box-shadow 150ms;
  box-shadow: var(--shadow-glow);
}
.btn-send:hover { background: #4F5CE6; transform: translateY(-1px); box-shadow: 0 4px 24px rgba(88,101,242,0.30); }
.btn-send:disabled { opacity: 0.35; box-shadow: none; transform: none; cursor: not-allowed; }
.btn-send svg { width: 16px; height: 16px; }

/* ============================================================
   MESSAGE COMPONENTS
   ============================================================ */

/* ── Message Wrapper ── */
.msg {
  display: flex;
  flex-direction: column;
  animation: fadeInUp 350ms var(--ease-out) both;
  max-width: 780px;
}
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }

.msg-role {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.msg.user .msg-role { flex-direction: row-reverse; }
.msg-role-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.msg.user .msg-role-dot { background: var(--accent); }
.msg.bot .msg-role-dot  { background: var(--success); }

/* ── User Bubble (iMessage-style blue) ── */
.bubble-user {
  background: var(--bg-bubble-user);
  border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1.55;
  color: #FFFFFF;
  max-width: 100%;
  word-break: break-word;
  box-shadow: 0 2px 8px rgba(88,101,242,0.20);
}

/* ── Bot Text (no background) ── */
.bot-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  max-width: 100%;
}
.bot-text p + p { margin-top: 8px; }

/* ── Suggestions ── */
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.chip {
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--bg-chip);
  border: 1px solid transparent;
  transition: background 150ms, color 150ms, border-color 150ms;
  cursor: pointer;
}
.chip:hover { background: var(--bg-chip-hover); color: var(--accent); border-color: rgba(88,101,242,0.18); }

/* ── System message ── */
.msg-system {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  animation: fadeInUp 350ms var(--ease-out) both;
  max-width: 780px;
  align-self: flex-start;
}
.msg-system-line {
  width: 2px;
  height: 100%;
  min-height: 16px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* ============================================================
   CLARIFY CARD
   ============================================================ */
.card-clarify {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 100%;
  box-shadow: var(--shadow-card);
  animation: fadeInUp 350ms var(--ease-out) both;
}
.card-clarify-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}
.card-clarify-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.card-clarify-reason { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.card-clarify-msg { font-size: 14px; color: var(--text-primary); line-height: 1.5; }

/* ── Prompt section ── */
.prompt-section { margin-top: 16px; }
.prompt-section + .prompt-section { margin-top: 20px; }
.prompt-label {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.prompt-required { color: var(--danger); font-size: 10px; }

/* Option Cards (single_select) */
.option-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.option-card {
  flex: 1;
  min-width: 140px;
  padding: 14px 16px;
  background: var(--bg-option);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  cursor: pointer;
  position: relative;
  transition: background 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
}
.option-card:hover { background: var(--bg-option-hover); border-color: var(--border-hover); transform: scale(1.01); box-shadow: var(--shadow-card); }
.option-card.selected {
  background: var(--bg-option-selected);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(88,101,242,0.15);
}
.option-card-value { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.option-card-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.option-card-check {
  position: absolute;
  top: 10px; right: 10px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: scale(0);
  transition: opacity 200ms, transform 250ms var(--ease-spring);
}
.option-card.selected .option-card-check { opacity: 1; transform: scale(1); }
.option-card-check svg { width: 10px; height: 10px; }

/* ============================================================
   SEARCHABLE SELECTOR (for prompts with > 6 candidates)
   ============================================================ */
.selector-search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.selector-search {
  width: 100%;
  padding: 9px 36px 9px 14px;
  background: var(--bg-root);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.selector-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88,101,242,0.10);
}
.selector-search::placeholder { color: var(--text-tertiary); }
.selector-search-icon {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
  width: 16px; height: 16px;
}
.selector-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.selector-cat-chip {
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-chip);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 150ms var(--ease-out);
  letter-spacing: 0.01em;
}
.selector-cat-chip:hover { background: var(--bg-chip-hover); color: var(--accent); }
.selector-cat-chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.selector-list-wrap {
  position: relative;
  max-height: 280px;
  overflow-y: auto;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}
.selector-list-wrap::after {
  content: '';
  position: sticky;
  bottom: 0; left: 0; right: 0;
  height: 32px;
  background: linear-gradient(transparent, var(--bg-card) 80%);
  pointer-events: none;
}
.selector-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-primary);
  transition: background 120ms var(--ease-out);
  border-bottom: 1px solid rgba(0,0,0,0.03);
  min-height: 40px;
  position: relative;
}
.selector-row:last-child { border-bottom: none; }
.selector-row:hover { background: rgba(88,101,242,0.04); }
.selector-row.selected {
  background: rgba(88,101,242,0.06);
}
.selector-row.selected::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.selector-row-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border-hover);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 150ms, background 150ms;
}
.selector-row.selected .selector-row-dot {
  border-color: var(--accent);
  background: var(--accent);
}
.selector-row.selected .selector-row-dot::after {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: white;
}
.selector-row-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.selector-row-cat {
  font-size: 10px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  background: var(--bg-chip);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.selector-row-check {
  display: none;
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.selector-row.selected .selector-row-check { display: block; }
.selector-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  border-top: 1px solid var(--border-card);
}
.selector-clear {
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  transition: background 150ms;
}
.selector-clear:hover { background: rgba(88,101,242,0.06); }
.match-highlight {
  color: var(--accent);
  font-weight: 600;
  background: rgba(88,101,242,0.10);
  border-radius: 2px;
  padding: 0 1px;
}
.selector-no-results {
  padding: 24px 14px;
  text-align: center;
  font-size: 13px;
  color: var(--text-tertiary);
}
.recent-divider {
  padding: 8px 14px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: center;
}
.selector-row.recent {
  background: rgba(88,101,242,0.03);
}
.selector-row.recent:hover {
  background: rgba(88,101,242,0.07);
}

/* Multi-Select Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-select {
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  background: var(--bg-chip);
  border: 1px solid transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 200ms var(--ease-out);
}
.chip-select:hover { background: var(--bg-chip-hover); }
.chip-select.selected {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(88,101,242,0.22);
}

/* Text Input */
.input-prompt {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-root);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.input-prompt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,101,242,0.10); }

/* Submit button for clarify */
.clarify-actions {

   TASK CARD
   ============================================================ */

  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  width: 100%;
  overflow: hidden;

.msg:has(.card-task) { max-width: 1260px; }
.msg:has(.card-confirm) { max-width: 1260px; }

}

  background: rgba(239,68,68,0.04);
}
.card-task-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;

}
.card-task-icon { font-size: 18px; flex-shrink: 0; }
.card-task-title { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.ready   { background: var(--success); animation: breathe 2s ease-in-out infinite; }
.status-dot.submitted { background: var(--success); }
.status-dot.blocked { background: var(--danger); }
.status-dot.needs_confirmation { background: var(--warning); animation: pulse 1.5s ease-in-out infinite; }

.task-dataset-info {

  width: 1px;

   ============================================================ */

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.55; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.30); }
  50%      { box-shadow: 0 0 8px 2px rgba(245,158,11,0.20); }
}
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30%           { transform: translateY(-6px); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes thinkSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes thinkDash {
  0%   { stroke-dashoffset: 0; }
  50%  { stroke-dashoffset: 60; }
  100% { stroke-dashoffset: 0; }
}

<script>
/* ============================================================
   Polyfill: crypto.randomUUID() for non-secure contexts
   e.g. http://hostname:port (only localhost/127.0.0.1 are
   considered secure contexts for this API).
   ============================================================ */
if (!crypto.randomUUID) {
  crypto.randomUUID = function() {
    const buf = new Uint8Array(16);
    crypto.getRandomValues(buf);
    // UUID v4: set version nibble to 4 and variant bits to 10xx
    buf[6] = (buf[6] & 0x0f) | 0x40;
    buf[8] = (buf[8] & 0x3f) | 0x80;
    const hex = Array.from(buf, b => b.toString(16).padStart(2, '0'));
    return hex.slice(0,4).join('') + '-' +
           hex.slice(4,6).join('') + '-' +
           hex.slice(6,8).join('') + '-' +
           hex.slice(8,10).join('') + '-' +
           hex.slice(10,16).join('');
  };
}

/* ============================================================
   MaiaChat — Conversational AI Chat Engine
   ============================================================ */

const LS_KEY = 'maia_sessions';
const API_URL = '/turns';

/* ── DOM refs ── */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const chatArea   = $('#chat-area');
const msgInput   = $('#message-input');
const btnSend    = $('#btn-send');
const sessionList= $('#session-list');
const welcome    = $('#welcome');
const topbarTitle= $('#topbar-title');
const toastCont  = $('#toast-container');

/* ── State ── */
let state = loadState();
let thinkEl = null;
let thinkTimer = null;

/* ============================================================
   STORAGE
   ============================================================ */
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.sessions && parsed.activeId) return parsed;
    }
  } catch (_) {}
  return { sessions: {}, activeId: null, order: [] };
}
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}
function getActiveSession() {
  return state.activeId ? state.sessions[state.activeId] : null;
}

/* ============================================================
   SESSION MANAGEMENT
   ============================================================ */
function createSession() {
  const id = crypto.randomUUID();
  const now = new Date().toISOString();
  state.sessions[id] = { id, title: '新会话', createdAt: now, messages: [] };
  state.order.unshift(id);
  state.activeId = id;
  saveState();
  renderSidebar();
  showSession(id);
}

function deleteSession(id, e) {
  e.stopPropagation();
  delete state.sessions[id];
  state.order = state.order.filter(i => i !== id);
  if (state.activeId === id) {
    state.activeId = state.order[0] || null;
    if (state.activeId) showSession(state.activeId);
    else showWelcome();
  }
  saveState();
  renderSidebar();
}

function switchSession(id) {
  state.activeId = id;
  saveState();
  showSession(id);
}

function showSession(id) {
  const s = state.sessions[id];
  if (!s) return showWelcome();
  hideWelcome();
  topbarTitle.textContent = s.title || 'SigMA Copilot';
  chatArea.innerHTML = '';
  let bi = 0;
  s.messages.forEach(m => {
    if (m.role === 'bot') appendMessage(m, bi++);
    else appendMessage(m);
  });
  // Restore unsaved draft selections for clarify cards
  restoreDraftSelections(id);
  scrollDown();
}

function showWelcome() {
  state.activeId = null;
  topbarTitle.textContent = 'SigMA Copilot';
  chatArea.innerHTML = '';
  chatArea.appendChild(welcome);
  welcome.style.display = '';
}

function hideWelcome() {
  welcome.style.display = 'none';
  if (welcome.parentNode) welcome.remove();
}

function renderSidebar() {
  sessionList.innerHTML = '';
  state.order.forEach(id => {
    const s = state.sessions[id];
    const div = document.createElement('div');
    div.className = 'session-item' + (id === state.activeId ? ' active' : '');
    div.innerHTML = `
      <span class="session-title">${escHtml(s.title)}</span>
      <span class="session-time">${timeAgo(s.createdAt)}</span>
      <button class="btn-delete-session" title="删除">×</button>
    `;
    div.querySelector('.session-title').onclick = () => switchSession(id);
    div.querySelector('.btn-delete-session').onclick = (e) => deleteSession(id, e);
    sessionList.appendChild(div);
  });
}

/* ============================================================
   MESSAGE SENDING
   ============================================================ */
async function sendMessage(opts) {
  const options = opts || {};
  const text = msgInput.value.trim();
  if (!text) return;

  let session = getActiveSession();
  if (!session) {
    createSession();
    session = getActiveSession();
  }
  hideWelcome();

  // Optimistic: add user message
  const userMsg = { role: 'user', text, ts: Date.now() };
  session.messages.push(userMsg);
  if (!session.title || session.title === '新会话') {
    session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  }
  saveState();
  appendMessage(userMsg);
  renderSidebar();
  topbarTitle.textContent = session.title;

  msgInput.value = '';
  msgInput.style.height = 'auto';
  btnSend.disabled = true;

  // Typing indicator
  showThinking();

  // Build prompt_replies only if last bot message was a clarify plan
  const lastBot = [...session.messages].reverse().find(m => m.role === 'bot');
  const includePromptReplies = options.includePromptReplies !== false;
  const needsReplies = includePromptReplies && lastBot && lastBot.plan && lastBot.plan.kind === 'clarify' && lastBot.plan.prompts && lastBot.plan.prompts.length > 0;
  const promptReplies = needsReplies ? collectPromptReplies() : [];

  try {
    const body = {
      session_id: session.id,
      message: text,
      workspace_context: { lang: 'zh' }
    };
    if (needsReplies) body.prompt_replies = promptReplies;
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    hideThinking();

    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const botMsg = { role: 'bot', plan: data.plan, ts: Date.now() };
    session.messages.push(botMsg);
    saveState();
    appendMessage(botMsg, session.messages.filter(m => m.role === 'bot').length - 1);

    // Update title from first meaningful exchange
    if (session.messages.length <= 2) {
      session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
      saveState();
    }

  } catch (err) {
    hideThinking();
    toast(err.message || '请求失败', 'error');
  }

  scrollDown();
}

function collectPromptReplies(card) {
  const replies = [];
  if (!card) {
    const cards = document.querySelectorAll('.card-clarify');
    card = cards[cards.length - 1];
  }
  if (!card) return replies;
  card.querySelectorAll('.prompt-section[data-prompt-id]').forEach(el => {
    const id = el.dataset.promptId;
    const type = el.dataset.inputType;
    if (type === 'single_select') {
      // Try card mode first, then search mode
      let sel = el.querySelector('.option-card.selected');
      if (sel) { replies.push({ prompt_id: id, value: parseValue(sel.dataset.value) }); return; }
      sel = el.querySelector('.selector-row.selected');
      if (sel) replies.push({ prompt_id: id, value: parseValue(sel.dataset.value) });
    } else if (type === 'multi_select') {
      const vals = [];
      el.querySelectorAll('.chip-select.selected').forEach(c => vals.push(parseValue(c.dataset.value)));
      el.querySelectorAll('.selector-row.selected').forEach(r => vals.push(parseValue(r.dataset.value)));
      if (vals.length) replies.push({ prompt_id: id, value: vals });
    } else if (type === 'text') {
      const inp = el.querySelector('.input-prompt');
      if (inp && inp.value.trim()) replies.push({ prompt_id: id, value: inp.value.trim() });
    }
  });
  return replies;
}

/* ============================================================
   THINKING INDICATOR
   ============================================================ */
const THINK_VERBS = [
  'swimming', 'floating', 'drifting', 'glowing', 'shimmering',
  'brewing', 'stirring', 'blending', 'whisking', 'simmering',
  'humming', 'whistling', 'strumming', 'tuning', 'echoing',
  'doodling', 'sketching', 'tracing', 'shading', 'painting',
  'wandering', 'roaming', 'strolling', 'sauntering', 'meandering',
  'pondering', 'musing', 'wondering', 'reflecting', 'daydreaming',
  'twirling', 'spinning', 'swirling', 'spiraling', 'orbiting',
  'bubbling', 'fizzing', 'sparkling', 'glimmering', 'twinkling'
];
let _verbIdx = -1;

function pickVerb() {
  _verbIdx = (_verbIdx + 1 + Math.floor(Math.random() * 3) + 1) % THINK_VERBS.length;
  return THINK_VERBS[_verbIdx];
}

function showThinking() {
  hideThinking();
  thinkEl = document.createElement('div');
  thinkEl.className = 'thinking-indicator';
  thinkEl.innerHTML = `
    <svg class="thinking-icon" viewBox="0 0 20 20">
      <circle class="thinking-icon-ring" cx="10" cy="10" r="8"/>
    </svg>
    <span class="thinking-text">${pickVerb()}...</span>
  `;
  chatArea.appendChild(thinkEl);
  scrollDown();
  thinkTimer = setInterval(() => {
    if (!thinkEl) return;
    const textEl = thinkEl.querySelector('.thinking-text');
    if (textEl) {
      textEl.style.opacity = '0';
      setTimeout(() => {
        if (!thinkEl) return;
        textEl.textContent = pickVerb() + '...';
        textEl.style.opacity = '1';
      }, 300);
    }
  }, 1800 + Math.random() * 700);
}

function hideThinking() {
  if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
  if (thinkEl && thinkEl.parentNode) { thinkEl.remove(); }
  thinkEl = null;
}

/* ============================================================
   MESSAGE RENDERING
   ============================================================ */
function appendMessage(msg, botIdx) {
  const el = document.createElement('div');
  if (msg.role === 'user') {
    renderUser(el, msg);
  } else if (msg.plan) {
    renderPlan(el, msg.plan);
    if (botIdx != null && isFrozenMsg(botIdx)) {
      const card = el.querySelector('.card-clarify, .card-task, .card-confirm');
      if (card) { card.style.pointerEvents = 'none'; card.classList.add('card-frozen'); }
      // Restore visual selection state and button texts
      const data = getFrozenData(botIdx);
      if (data) {
        if (data.sel) restoreSelections(card, data.sel);
        restoreFrozenButtonTexts(card, data);
      }
    }
  }
  chatArea.appendChild(el);
  scrollDown();
}

function renderUser(el, msg) {
  el.className = 'msg user';
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>YOU</div>
    <div class="bubble-user">${escHtml(msg.text)}</div>
  `;
}

function renderPlan(el, plan) {
  switch (plan.kind) {
    case 'reply':          renderReply(el, plan); break;
    case 'clarify':        renderClarify(el, plan); break;
    case 'task':           renderTask(el, plan); break;
    case 'confirm':        renderConfirm(el, plan); break;
    case 'context_update': renderContextUpdate(el, plan); break;
    case 'context_clear':  renderContextClear(el, plan); break;
    default:               renderFallback(el, plan);
  }
}

/* ── Reply ── */
function renderReply(el, plan) {
  el.className = 'msg bot';
  const msgHtml = plan.message ? `<div class="bot-text">${escHtml(plan.message)}</div>` : '';
  let sugHtml = '';
  if (plan.suggestions && plan.suggestions.length) {
    sugHtml = '<div class="suggestions">' +
      plan.suggestions.map(s => `<button class="chip" onclick="quickReply(this)">${escHtml(s)}</button>`).join('') +
      '</div>';
  }
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>

}

/* ── Clarify ── */

function initSearchableSections(el) {
  el.querySelectorAll('.searchable-section').forEach(sec => {
    const promptId = sec.dataset.promptId;
    const listWrap = sec.querySelector('.selector-list-wrap');
    const countEl = sec.querySelector('#sel-count-' + promptId);
    if (countEl && listWrap) {
      const total = listWrap.querySelectorAll('.selector-row').length;
      countEl.textContent = `共 ${total} 个候选`;
      if (total === 0 && !listWrap.querySelector('.selector-no-results')) {
        const nr = document.createElement('div');
        nr.className = 'selector-no-results';
        nr.textContent = '无候选数据，请检查后端返回';
        listWrap.appendChild(nr);
      }
    }
    const searchInput = sec.querySelector('.selector-search');
    if (searchInput) {
      setTimeout(() => {
        const allSearchable = el.querySelectorAll('.searchable-section');
        if (allSearchable.length === 1) searchInput.focus();
      }, 150);
    }
  });
}

function buildPromptCard(prompt) {
  const candidates = prompt.candidates || [];
  const searchThreshold = prompt.input_type === 'single_select' ? 7 : 13;

  // product_type always uses search-first selector
  const forceSearch = prompt.id === 'product_type';

  if (!forceSearch && candidates.length < searchThreshold) {
    return buildCardBody(prompt, candidates);
  }
  return buildSearchBody(prompt, candidates);
}

/* ── Classic card body (≤ 6 single_select, ≤ 12 multi_select) ── */
function buildCardBody(prompt, candidates) {
  let body = '';
  if (prompt.input_type === 'single_select') {
    body = `
      <div class="option-cards">
        ${candidates.map(c => `
          <div class="option-card${c.disabled ? ' disabled' : ''}" data-value="${jsonAttr(c.value)}" onclick="selectOption(this)" ${c.disabled ? 'aria-disabled="true"' : ''}>
            <div class="option-card-value">${escHtml(c.label)}</div>
            ${c.description ? `<div class="option-card-desc">${escHtml(c.description)}</div>` : ''}
            <div class="option-card-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        `).join('')}
      </div>`;
  } else if (prompt.input_type === 'multi_select') {
    body = `
      <div class="chip-group">
        ${candidates.map(c => `
          <button class="chip-select" data-value="${jsonAttr(c.value)}" onclick="toggleChip(this)">${escHtml(c.label)}</button>
        `).join('')}
      </div>`;
  } else {
    body = `<input class="input-prompt" type="text" placeholder="${escAttr(prompt.message)}" oninput="saveDraftFromCard(this)">`;
  }
  return `
    <div class="prompt-section" data-prompt-id="${escAttr(prompt.id)}" data-input-type="${escAttr(prompt.input_type)}">
      <div class="prompt-label">${escHtml(prompt.label)} ${prompt.required ? '<span class="prompt-required">*必填</span>' : ''}</div>
      ${body}
    </div>`;
}

/* ── Search-first selector body (> 6 single_select, > 12 multi_select) ── */
function buildSearchBody(prompt, candidates) {
  const categories = extractCategories(candidates);
  const showCats = categories.length >= 2;
  const promptId = escAttr(prompt.id);
  const inputType = escAttr(prompt.input_type);
  const isMulti = prompt.input_type === 'multi_select';

  const catHtml = showCats ? `
    <div class="selector-categories">
      ${categories.map((cat, i) => `
        <span class="selector-cat-chip" onclick="toggleCatChip(this, '${promptId}')">${escHtml(cat)}</span>
      `).join('')}
    </div>` : '';

  const rows = buildSearchRows(candidates, '', isMulti, promptId, []);

  return `
    <div class="prompt-section searchable-section" data-prompt-id="${promptId}" data-input-type="${inputType}">
      <div class="prompt-label">${escHtml(prompt.label)} ${prompt.required ? '<span class="prompt-required">*必填</span>' : ''}</div>
      <div class="selector-search-wrap">
        <input class="selector-search" type="text" placeholder="搜索..." oninput="filterSelector(this, '${promptId}')" autocomplete="off">
        <svg class="selector-search-icon" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </div>
      ${catHtml}
      <div class="selector-list-wrap" id="sel-list-${promptId}">
        ${rows}
      </div>
      <div class="selector-footer" id="sel-footer-${promptId}">
        <span id="sel-count-${promptId}"></span>
      </div>
    </div>`;
}

/* ── Category extraction from labels ── */
function extractCategories(candidates) {
  const cats = new Set();
  candidates.forEach(c => {
    const m = String(c.label).match(/（(.+?)）$/);
    const cat = m ? m[1] : '其他';
    cats.add(cat);
  });
  return Array.from(cats);
}

/* ── Build search rows HTML ── */
function buildSearchRows(candidates, query, isMulti, promptId, activeCatsOverride) {
  const activeCats = activeCatsOverride !== undefined ? activeCatsOverride : getActiveCategories(promptId);
  let visible = candidates;
  if (activeCats.length) {
    visible = candidates.filter(c => {
      const m = String(c.label).match(/（(.+?)）$/);
      const cat = m ? m[1] : '其他';
      return activeCats.includes(cat);
    });
  }
  if (query) {
    const q = query.toLowerCase();
    visible = visible.filter(c => String(c.label).toLowerCase().includes(q));
  }

  // ── Recent selections ──
  const recents = getRecents(promptId);
  const recentCandidates = [];
  if (recents.length && !query) {
    // Show recents that still exist in candidates
    recents.forEach(r => {
      const match = candidates.find(c => JSON.stringify(c.value) === JSON.stringify(r.value));
      if (match) recentCandidates.push(match);
    });
  }

  if (visible.length === 0 && recentCandidates.length === 0) {
    return '<div class="selector-no-results">无匹配结果</div>';
  }

  let html = '';
  if (recentCandidates.length) {
    html += '<div class="recent-divider">★ 最近使用</div>';
    html += recentCandidates.map(c => renderSelectorRow(c, query, isMulti, true)).join('');
    html += '<div class="recent-divider">—— 全部 · 共 ' + visible.length + ' 个 ——</div>';
  }
  html += visible.map(c => renderSelectorRow(c, query, isMulti, false)).join('');
  return html;
}

function renderSelectorRow(c, query, isMulti, isRecent) {
  const cat = extractCatLabel(c.label);
  return `
    <div class="selector-row${isRecent ? ' recent' : ''}" data-value="${jsonAttr(c.value)}" data-cat="${escAttr(cat)}" data-label="${escAttr(c.label)}" onclick="${isMulti ? 'toggleSearchRow(this)' : 'selectSearchRow(this)'}">
      ${isMulti ? '<div class="selector-row-dot" style="border-radius:4px;"></div>' : '<div class="selector-row-dot"></div>'}
      <span class="selector-row-label">${highlightMatch(c.label, query)}</span>
      <span class="selector-row-cat">${escHtml(cat)}</span>
      <span class="selector-row-check">${isMulti ? '' : '✓'}</span>
    </div>`;
}

function extractCatLabel(label) {
  const m = String(label).match(/（(.+?)）$/);
  return m ? m[1] : '其他';
}

/* ── Highlight matching text ── */
function highlightMatch(text, query) {
  if (!query) return escHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return escHtml(text).replace(re, '<mark class="match-highlight">$1</mark>');
}

/* ── Get active category chips ── */
function getActiveCategories(promptId, card) {
  if (!card) card = document.querySelector('.card-clarify');
  if (!card) return [];
  const section = card.querySelector(`.prompt-section[data-prompt-id="${promptId}"]`);
  if (!section) return [];
  const chips = section.querySelectorAll('.selector-cat-chip.active');
  return Array.from(chips).map(c => c.textContent);
}

/* ── Category chip toggle ── */
function toggleCatChip(chip, promptId) {
  const card = chip.closest('.card-clarify');
  if (!card) return;
  const section = card.querySelector(`.prompt-section[data-prompt-id="${promptId}"]`);
  if (!section) return;
  const wasActive = chip.classList.contains('active');
  section.querySelectorAll('.selector-cat-chip').forEach(c => c.classList.remove('active'));
  if (!wasActive) chip.classList.add('active');
  const searchInput = section.querySelector('.selector-search');
  if (searchInput) filterSelector(searchInput, promptId, card);
}

/* ── Filter rows by search + categories ── */
function filterSelector(input, promptId, card) {
  if (!card) card = input.closest('.card-clarify');
  if (!card) return;
  const section = card.querySelector(`.prompt-section[data-prompt-id="${promptId}"]`);
  if (!section) return;
  const listWrap = section.querySelector('.selector-list-wrap');
  if (!listWrap) return;
  const countEl = section.querySelector('#sel-count-' + promptId);
  const query = input && input.value ? input.value.trim() : '';
  const rows = listWrap.querySelectorAll('.selector-row');
  const dividers = listWrap.querySelectorAll('.recent-divider');
  const activeCats = getActiveCategories(promptId, card);
  let visibleCount = 0;
  let visibleRecent = 0;
  const totalCount = rows.length;

  // Remove stale no-results
  const nr = listWrap.querySelector('.selector-no-results');
  if (nr) nr.remove();

  rows.forEach(row => {
    const label = (row.dataset.label || '').toLowerCase();
    const cat = row.dataset.cat || '';
    const matchQuery = !query || label.includes(query.toLowerCase());
    const matchCat = activeCats.length === 0 || activeCats.includes(cat);
    if (matchQuery && matchCat) {
      row.style.display = '';
      const labelEl = row.querySelector('.selector-row-label');
      if (labelEl) {
        if (query) labelEl.innerHTML = highlightMatch(row.dataset.label, query);
        else labelEl.textContent = row.dataset.label;
      }
      visibleCount++;
      if (row.classList.contains('recent')) visibleRecent++;
    } else {
      row.style.display = 'none';
    }
  });

  // Show/hide dividers
  dividers.forEach(d => {
    d.style.display = query ? 'none' : '';
  });

  if (visibleCount === 0 && totalCount > 0) {
    const nr2 = document.createElement('div');
    nr2.className = 'selector-no-results';
    nr2.textContent = '无匹配结果';
    listWrap.appendChild(nr2);
  }

  if (countEl) {
    countEl.textContent = (visibleCount === totalCount && !query && activeCats.length === 0)
      ? `共 ${totalCount} 个候选`
      : `${visibleCount} 个匹配 · 共 ${totalCount} 个候选`;
  }
}

/* ── Select a row (single_select) ── */
function selectSearchRow(row) {
  const listWrap = row.closest('.selector-list-wrap');
  listWrap.querySelectorAll('.selector-row').forEach(r => r.classList.remove('selected'));
  row.classList.add('selected');
  saveDraftFromCard(row);
}

/* ── Toggle a row (multi_select) ── */
function toggleSearchRow(row) {
  row.classList.toggle('selected');
  saveDraftFromCard(row);
}

/* ── Confirm ── */
function taskDownloadLinks(data) {
  const urls = Array.isArray(data?.downloads) ? data.downloads : Array.isArray(data?.data) ? data.data : [];
  return urls.filter(url => typeof url === 'string' && /^https?:\/\//i.test(url));
}

function downloadLabel(url, index) {
  try {
    const pathname = new URL(url).pathname;
    const value = decodeURIComponent(pathname.slice(pathname.lastIndexOf('/') + 1));
    return value || `download-${index + 1}`;
  } catch (_) {
    return `download-${index + 1}`;
  }
}

let _arrCounter = 0;
function summarizePayload(payload) {
  if (!payload) return '';
  const lines = [];
  if (payload.record_count != null) lines.push(`<div class="sum-row"><span class="sum-key">记录数</span><span class="sum-val">${escHtml(String(payload.record_count))} 条</span></div>`);
  if (payload.operation) {
    const opLabel = payload.operation.replace(/^task\./, '').replace(/\./g, ' › ');
    lines.push(`<div class="sum-row"><span class="sum-key">操作</span><span class="sum-val">${escHtml(opLabel)}</span></div>`);
  }
  if (payload.params) {
    const paramKeys = Object.keys(payload.params);
    for (const key of paramKeys) {
      const val = payload.params[key];
      if (typeof val === 'string' || typeof val === 'number' || typeof val === 'boolean') {
        lines.push(`<div class="sum-row"><span class="sum-key">${escHtml(key)}</span><span class="sum-val">${escHtml(String(val))}</span></div>`);
      } else if (Array.isArray(val)) {
        const count = val.length;
        _arrCounter++;
        const extraId = 'arr-x-' + _arrCounter;
        const toggleId = 'arr-t-' + _arrCounter;
        const items = val.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x));
        const visible = items.slice(0, 5).map(x => escHtml(x)).join(', ');
        if (count <= 5) {
          lines.push(`<div class="sum-row"><span class="sum-key">${escHtml(key)}</span><span class="sum-val">[${visible}]</span><span class="sum-arr-count">${count} 项</span></div>`);
        } else {
          const hidden = items.slice(5).map(x => escHtml(x)).join(', ');
          lines.push(`<div class="sum-row"><span class="sum-key">${escHtml(key)}</span><span class="sum-val">[${visible}, <span class="sum-arr-extra" id="${extraId}">${hidden}</span><span class="sum-arr-toggle" id="${toggleId}" onclick="toggleArrDetail('${extraId}','${toggleId}')">展开全部 ▸</span>]</span><span class="sum-arr-count">${count} 项</span></div>`);
        }
      } else if (typeof val === 'object' && val !== null) {
        lines.push(`<div class="sum-row"><span class="sum-key">${escHtml(key)}</span><span class="sum-val">${escHtml(JSON.stringify(val))}</span></div>`);
      }
    }
  }
  if (lines.length === 0) return '';
  return lines.join('');
}

function toggleDetail(id, toggleEl) {
  const detail = document.getElementById(id);
  if (!detail) return;
  const isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : 'block';
  const label = toggleEl.querySelector('.toggle-label');
  const arrow = toggleEl.querySelector('.toggle-arrow');
  if (label) label.textContent = isOpen ? '查看详情' : '收起详情';
  if (arrow) arrow.textContent = isOpen ? '▸' : '▾';
}

function toggleArrDetail(extraId, toggleId) {
  const extra = document.getElementById(extraId);
  const toggle = document.getElementById(toggleId);
  if (!extra || !toggle) return;
  const isHidden = getComputedStyle(extra).display === 'none';
  extra.style.display = isHidden ? 'inline' : 'none';
  toggle.textContent = isHidden ? '收起 ▾' : '展开全部 ▸';
}

/* ── Context ── */
function renderContextUpdate(el, plan) {
  el.className = 'msg-system';
  el.innerHTML = `
    <div class="msg-system-line"></div>
    <div>${escHtml(plan.message || 'Context updated.')}</div>
  `;
}
function renderContextClear(el, plan) {
  el.className = 'msg-system';
  el.innerHTML = `
    <div class="msg-system-line"></div>
    <div>${escHtml(plan.message || 'Context cleared.')}</div>
  `;
}
function renderFallback(el, plan) {
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    <div class="bot-text">${escHtml(JSON.stringify(plan, null, 2))}</div>
  `;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function quickReply(btn) {
  const text = btn.textContent;
  btn.closest('.msg').querySelectorAll('.chip').forEach(c => c.disabled = true);
  msgInput.value = text;
  sendMessage();
}

function selectOption(el) {
  if (el.classList.contains('disabled')) return;
  const group = el.closest('.option-cards');
  group.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  saveDraftFromCard(el);
}

function toggleChip(el) {
  el.classList.toggle('selected');
  saveDraftFromCard(el);
}

function submitClarify(btn) {
  const card = btn.closest('.card-clarify');
  const replies = collectPromptReplies(card);
  disableCardButtons(btn, replies, 'submitted');
  btn.textContent = '已提交';
  saveRecentFromCard(card);
  // Clear draft for this session since the card is now frozen
  const session = getActiveSession();
  if (session) clearDraftSelections(session.id);
  // Send a synthetic message with the replies
  if (!session) return;
  const promptMsg = replies.map(r => `${r.prompt_id}: ${Array.isArray(r.value) ? r.value.join(', ') : r.value}`).join('; ');
  msgInput.value = `[已选择] ${promptMsg}`;
  sendMessage();
}

function cancelClarify(btn) {
  disableCardButtons(btn, null, 'cancelled_clarify');
  btn.textContent = '已取消';
  // Clear draft for this session since the card is now frozen
  const session = getActiveSession();
  if (session) clearDraftSelections(session.id);
  msgInput.value = '取消';
  sendMessage({ includePromptReplies: false });
}

function dismissCard(btn) {
  disableCardButtons(btn, null, 'cancelled');
  btn.textContent = '已取消';
  msgInput.value = 'N';
  sendMessage();
}

function dismissCardVisual(btn) {
  disableCardButtons(btn, null, 'dismissed');
  btn.textContent = '已了解';
}

function confirmTask(btn) {
  disableCardButtons(btn, null, 'confirmed_task');
  btn.textContent = '已确认';
  msgInput.value = 'Y';
  sendMessage();
}

function confirmAction(btn) {
  disableCardButtons(btn, null, 'confirmed');
  btn.textContent = '已确认';
  msgInput.value = 'Y';
  sendMessage();
}

function disableCardButtons(btn, selections, action) {
  const card = btn.closest('.card-clarify, .card-task, .card-confirm');
  if (!card) return;
  card.style.pointerEvents = 'none';
  card.classList.add('card-frozen');
  const session = getActiveSession();
  if (!session) return;
  const botMsgs = session.messages.filter(m => m.role === 'bot');
  const idx = botMsgs.length - 1;
  if (idx < 0) return;
  try {
    const key = 'maia_frozen_' + session.id;
    const frozen = JSON.parse(localStorage.getItem(key) || '{}');
    frozen[idx] = { action: action || 'dismissed' };
    if (selections) frozen[idx].sel = selections;
    localStorage.setItem(key, JSON.stringify(frozen));
  } catch (_) {}
}

function restoreFrozenButtonTexts(card, data) {
  if (!data || !data.action) return;
  const btns = card.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  let target = null, text = '';
  switch (data.action) {
    case 'confirmed':         target = card.querySelector('.btn-danger'); text = '已确认'; break;
    case 'cancelled':         target = card.querySelector('.btn-ghost');  text = '已取消'; break;
    case 'dismissed':         target = card.querySelector('.btn-primary'); text = '已了解'; break;
    case 'submitted':         target = card.querySelector('.btn-primary'); text = '已提交'; break;
    case 'cancelled_clarify': target = card.querySelector('.btn-ghost');  text = '已取消'; break;
    case 'confirmed_task':    target = card.querySelector('.btn-primary'); text = '已确认'; break;
  }
  if (target) target.textContent = text;
}

/* ── Scroll ── */
function scrollDown() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
    // Force a second frame to ensure layout is complete after restore
    requestAnimationFrame(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  });
}

/* ── Toast ── */
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  toastCont.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(40px)';
    el.style.transition = 'all 200ms ease-in';
    setTimeout(() => el.remove(), 250);
  }, 3000);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function jsonAttr(v) {
  return escAttr(typeof v === 'object' && v !== null ? JSON.stringify(v) : String(v));
}
function parseValue(raw) {
  if (!raw) return raw;
  try { return JSON.parse(raw); } catch (_) { return raw; }
}
function formatParam(v) {
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(', ');
  if (typeof v === 'object' && v !== null) {
    // indicator: {name, index} → "name (index)"
    if ('name' in v && 'index' in v) return `${v.name} (${v.index})`;
    return JSON.stringify(v);
  }
  return String(v);
}
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins}分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}小时前`;
  return `${Math.floor(hrs / 24)}天前`;
}
function isFrozenMsg(botIdx) {
  return !!getFrozenData(botIdx);
}
function getFrozenData(botIdx) {
  const session = getActiveSession();
  if (!session) return null;
  try {
    const key = 'maia_frozen_' + session.id;
    const frozen = JSON.parse(localStorage.getItem(key) || '{}');
    return frozen[botIdx] || null;
  } catch (_) { return null; }
}
function restoreSelections(card, sel) {
  sel.forEach(s => {
    const sec = card.querySelector(`.prompt-section[data-prompt-id="${s.prompt_id}"]`);
    if (!sec) return;
    const val = typeof s.value === 'object' ? JSON.stringify(s.value) : String(s.value);
    // Card mode
    const opt = sec.querySelector(`.option-card[data-value="${escAttr(val)}"]`);
    if (opt) { opt.classList.add('selected'); return; }
    // Search mode single row
    const row = sec.querySelector(`.selector-row[data-value="${escAttr(val)}"]`);
    if (row) { row.classList.add('selected'); return; }
    // Text input — value is a plain string that didn't match any option/row
    const inp = sec.querySelector('.input-prompt');
    if (inp) { inp.value = s.value; return; }
    // Multi-select chips
    if (Array.isArray(s.value)) {
      s.value.forEach(v => {
        const vs = typeof v === 'object' ? JSON.stringify(v) : String(v);
        const chip = sec.querySelector(`.chip-select[data-value="${escAttr(vs)}"]`);
        if (chip) chip.classList.add('selected');
        const sr = sec.querySelector(`.selector-row[data-value="${escAttr(vs)}"]`);
        if (sr) sr.classList.add('selected');
      });
    }
  });
}
function reasonLabel(r) {
  const map = {
    low_confidence: '低置信度',
    ambiguous_intent: '意图模糊',
    missing_slots: '缺少信息',
    invalid_slots: '无效参数',
    ambiguous_slots: '参数歧义'
  };
  return map[r] || r;
}
function statusLabel(s) {
  const map = { ready: '就绪', submitted: '已提交', needs_confirmation: '需确认', blocked: '阻塞' };
  return map[s] || s;
}

/* ── Recent selections (localStorage) ── */
const RECENT_KEY = 'maia_recent';
const RECENT_MAX = 5;

/* ── Draft selections (localStorage) — survive page refresh ── */
const DRAFT_KEY_PREFIX = 'maia_draft_';

function getDraftSelections(sessionId) {
  try {
    const raw = localStorage.getItem(DRAFT_KEY_PREFIX + sessionId);
    return raw ? JSON.parse(raw) : {};
  } catch (_) { return {}; }
}

function saveDraftSelections(sessionId, botIdx, selections) {
  try {
    const key = DRAFT_KEY_PREFIX + sessionId;
    const drafts = getDraftSelections(sessionId);
    if (selections && selections.length) {
      drafts[botIdx] = selections;
    } else {
      delete drafts[botIdx];
    }
    if (Object.keys(drafts).length === 0) {
      localStorage.removeItem(key);
    } else {
      localStorage.setItem(key, JSON.stringify(drafts));
    }
  } catch (_) {}
}

function clearDraftSelections(sessionId) {
  try {
    localStorage.removeItem(DRAFT_KEY_PREFIX + sessionId);
  } catch (_) {}
}

function saveDraftFromCard(el) {
  const session = getActiveSession();
  if (!session) return;
  const botMsgs = session.messages.filter(m => m.role === 'bot');
  let card;
  let botIdx;
  if (el) {
    card = el.closest('.card-clarify');
  }
  if (card) {
    botIdx = getCardBotIndex(card);
  } else {
    botIdx = botMsgs.length - 1;
  }
  if (botIdx < 0) return;
  const replies = collectPromptReplies(card);
  saveDraftSelections(session.id, botIdx, replies);
}

function restoreDraftSelections(sessionId) {
  const drafts = getDraftSelections(sessionId);
  if (!Object.keys(drafts).length) return;
  const cards = document.querySelectorAll('.card-clarify');
  cards.forEach(card => {
    if (card.style.pointerEvents === 'none') return; // already frozen
    // Map this card to its bot message index by counting preceding bot messages
    const botIdx = getCardBotIndex(card);
    if (botIdx == null) return;
    const sel = drafts[botIdx];
    if (sel && sel.length) {
      restoreSelections(card, sel);
    }
  });
}

function getCardBotIndex(card) {
  // Count bot messages before this card's DOM element
  const allBotMsgs = chatArea.querySelectorAll('.msg.bot');
  let idx = 0;
  for (const el of allBotMsgs) {
    if (el === card.closest('.msg.bot')) return idx;
    idx++;
  }
  return null;
}

function getRecents(promptId) {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    if (raw) {
      const all = JSON.parse(raw);
      return (all[promptId] || []).slice(0, RECENT_MAX);
    }
  } catch (_) {}
  return [];
}

function saveRecents(promptId, entries) {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    const all = raw ? JSON.parse(raw) : {};
    // Deduplicate by stringified value, keep newest first
    const existing = (all[promptId] || []).filter(e => {
      return !entries.some(n => JSON.stringify(n.value) === JSON.stringify(e.value));
    });
    all[promptId] = [...entries, ...existing].slice(0, RECENT_MAX);
    localStorage.setItem(RECENT_KEY, JSON.stringify(all));
  } catch (_) {}
}

function saveRecentFromCard(card) {
  if (!card) return;
  const prompts = card.querySelectorAll('.prompt-section.searchable-section');
  prompts.forEach(sec => {
    const promptId = sec.dataset.promptId;
    const sel = sec.querySelector('.selector-row.selected');
    if (!sel) return;
    saveRecents(promptId, [{
      value: parseValue(sel.dataset.value),
      label: sel.dataset.label || '',
      cat: sel.dataset.cat || '',
      ts: Date.now()
    }]);
  });
  // Also handle card-mode selections
  card.querySelectorAll('.prompt-section:not(.searchable-section)').forEach(sec => {
    const promptId = sec.dataset.promptId;
    const selCard = sec.querySelector('.option-card.selected');
    if (!selCard) return;
    const val = parseValue(selCard.dataset.value);
    saveRecents(promptId, [{
      value: val,
      label: (selCard.querySelector('.option-card-value') || {}).textContent || '',
      cat: '',
      ts: Date.now()
    }]);
  });
}

   EVENT LISTENERS

  if (e.key === 'Enter' && !e.shiftKey) {

  }

msgInput.addEventListener('input', () => {
  btnSend.disabled = !msgInput.value.trim();

  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

$('#btn-toggle-sidebar').addEventListener('click', () => {

});

chatArea.addEventListener('click', () => {
  if (window.innerWidth < 768) $('#sidebar').classList.add('collapsed');
});

/* ============================================================
   INIT
   ============================================================ */
if (state.activeId && state.sessions[state.activeId]) {
  showSession(state.activeId);
} else if (state.order.length > 0) {
  state.activeId = state.order[0];
  showSession(state.activeId);
} else {

requestAnimationFrame(() => {

    chatArea.scrollTop = chatArea.scrollHeight;
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 200);
  });
});
