<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigMA Copilot</title>
<style>
/* ============================================================
   Sigma Maia — Chat UI Design System
   Premium Light — Apple / Linear inspired aesthetic
   ============================================================ */

:root {
  /* ── Palette ── */
  --bg-root:       #F3F3F6;
  --bg-sidebar:    #F9F9FB;
  --bg-main:       #FCFCFD;
  --bg-card:       #FFFFFF;
  --bg-card-hover: #F7F7FA;
  --bg-bubble-user:#5865F2;
  --bg-input:      #FFFFFF;
  --bg-chip:       #ECECF2;
  --bg-chip-hover: rgba(88,101,242,0.08);
  --bg-option:     #F7F7FC;
  --bg-option-hover:#EEEFF8;
  --bg-option-selected: rgba(88,101,242,0.06);

  --border-subtle: #E4E4ED;
  --border-card:   #EBEBF2;
  --border-hover:  #CFCFDC;
  --border-active: #5865F2;

  --accent:        #5865F2;
  --accent-glow:   rgba(88,101,242,0.18);
  --success:       #22C55E;
  --warning:       #F59E0B;
  --danger:        #EF4444;

  --text-primary:  #19191E;
  --text-secondary:#696978;
  --text-tertiary: #9B9BAA;
  --text-inverse:  #FFFFFF;

  /* ── Typography ── */
  --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
  --letter-spacing: -0.01em;

  /* ── Spacing ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  /* ── Shadows ── */
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-glow: 0 0 20px rgba(88,101,242,0.18);
  --shadow-danger: 0 0 16px rgba(239,68,68,0.20);

  /* ── Layout ── */
  --sidebar-width: 260px;
  --topbar-height: 44px;
  --input-height: 64px;

  /* ── Transitions ── */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  font-size: 14px;
  letter-spacing: var(--letter-spacing);
  color: var(--text-primary);
  background: var(--bg-root);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.18); }

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  transition: margin-left 250ms var(--ease-out), opacity 250ms var(--ease-out);
  z-index: 10;
}
#sidebar.collapsed {
  margin-left: calc(-1 * var(--sidebar-width));
  opacity: 0;
  pointer-events: none;
}
.sidebar-header {
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  color: var(--text-primary);
}
.sidebar-logo svg { width: 24px; height: 24px; }
.sidebar-logo span { background: linear-gradient(135deg, #5865F2, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-new-chat {
  width: calc(100% - 32px);
  margin: 0 16px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: rgba(88,101,242,0.07);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 150ms var(--ease-out), transform 150ms var(--ease-out);
}
.btn-new-chat:hover { background: rgba(88,101,242,0.13); transform: translateY(-1px); }
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.session-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  transition: background 150ms var(--ease-out);
  position: relative;
}
.session-item:hover { background: rgba(0,0,0,0.04); }
.session-item.active {
  background: rgba(88,101,242,0.06);
  color: var(--text-primary);
}
.session-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 16px;
  background: var(--accent);
  border-radius: 2px;
}
.session-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-time { font-size: 10px; color: var(--text-tertiary); flex-shrink: 0; margin-left: 8px; }
.btn-delete-session {
  opacity: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--text-tertiary);
  font-size: 14px;
  transition: opacity 150ms, color 150ms;
  flex-shrink: 0;
}
.session-item:hover .btn-delete-session { opacity: 1; }
.btn-delete-session:hover { color: var(--danger); background: rgba(239,68,68,0.08); }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-tertiary);
}
.sidebar-footer .avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5865F2, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white;
}

/* ── Main ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-main);
}

/* ── Topbar ── */
#topbar {
  height: var(--topbar-height);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.btn-toggle-sidebar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: background 150ms, color 150ms;
}
.btn-toggle-sidebar:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
.topbar-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
.topbar-dots { margin-left: auto; display: flex; gap: 6px; }
.topbar-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--border-subtle); }

/* ── Chat Area ── */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
/* Welcome state */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding-bottom: 80px;
}
.welcome-icon { width: 56px; height: 56px; margin-bottom: 8px; }
.welcome h2 { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.welcome p { font-size: 14px; color: var(--text-secondary); max-width: 400px; line-height: 1.6; }

/* ── Input Area ── */
#input-area {
  padding: 0 20px 20px;
  flex-shrink: 0;
  position: relative;
}
#input-area::before {
  content: '';
  position: absolute;
  top: -40px; left: 0; right: 0; height: 40px;
  background: linear-gradient(transparent, var(--bg-main) 70%);
  pointer-events: none;
}
.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 6px 6px 6px 18px;
  box-shadow: var(--shadow-card);
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.input-wrapper:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88,101,242,0.10), var(--shadow-card);
}
#message-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text-primary);
  padding: 8px 0;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
}
#message-input::placeholder { color: var(--text-tertiary); }
.btn-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 150ms, transform 150ms, box-shadow 150ms;
  box-shadow: var(--shadow-glow);
}
.btn-send:hover { background: #4F5CE6; transform: translateY(-1px); box-shadow: 0 4px 24px rgba(88,101,242,0.30); }
.btn-send:disabled { opacity: 0.35; box-shadow: none; transform: none; cursor: not-allowed; }
.btn-send svg { width: 16px; height: 16px; }

/* ============================================================
   MESSAGE COMPONENTS
   ============================================================ */

/* ── Message Wrapper ── */
.msg {
  display: flex;
  flex-direction: column;
  animation: fadeInUp 350ms var(--ease-out) both;
  max-width: 780px;
}
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }

.msg-role {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.msg.user .msg-role { flex-direction: row-reverse; }
.msg-role-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.msg.user .msg-role-dot { background: var(--accent); }
.msg.bot .msg-role-dot  { background: var(--success); }

/* ── User Bubble (iMessage-style blue) ── */
.bubble-user {
  background: var(--bg-bubble-user);
  border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1.55;
  color: #FFFFFF;
  max-width: 100%;
  word-break: break-word;
  box-shadow: 0 2px 8px rgba(88,101,242,0.20);
}

/* ── Bot Text (no background) ── */
.bot-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  max-width: 100%;
}
.bot-text p + p { margin-top: 8px; }

/* ── Suggestions ── */
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.chip {
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--bg-chip);
  border: 1px solid transparent;
  transition: background 150ms, color 150ms, border-color 150ms;
  cursor: pointer;
}
.chip:hover { background: var(--bg-chip-hover); color: var(--accent); border-color: rgba(88,101,242,0.18); }

/* ── System message ── */
.msg-system {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  animation: fadeInUp 350ms var(--ease-out) both;
  max-width: 780px;
  align-self: flex-start;
}
.msg-system-line {
  width: 2px;
  height: 100%;
  min-height: 16px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* ============================================================
   CLARIFY CARD
   ============================================================ */
.card-clarify {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 100%;
  box-shadow: var(--shadow-card);
  animation: fadeInUp 350ms var(--ease-out) both;
}
.card-clarify-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}
.card-clarify-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.card-clarify-reason { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.card-clarify-msg { font-size: 14px; color: var(--text-primary); line-height: 1.5; }

/* ── Prompt section ── */
.prompt-section { margin-top: 16px; }
.prompt-section + .prompt-section { margin-top: 20px; }
.prompt-label {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.prompt-required { color: var(--danger); font-size: 10px; }

/* Option Cards (single_select) */
.option-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.option-card {
  flex: 1;
  min-width: 140px;
  padding: 14px 16px;
  background: var(--bg-option);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  cursor: pointer;
  position: relative;
  transition: background 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
}
.option-card:hover { background: var(--bg-option-hover); border-color: var(--border-hover); transform: scale(1.01); box-shadow: var(--shadow-card); }
.option-card.selected {
  background: var(--bg-option-selected);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(88,101,242,0.15);
}
.option-card-value { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.option-card-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.option-card-check {
  position: absolute;
  top: 10px; right: 10px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: scale(0);
  transition: opacity 200ms, transform 250ms var(--ease-spring);
}
.option-card.selected .option-card-check { opacity: 1; transform: scale(1); }
.option-card-check svg { width: 10px; height: 10px; }

/* Multi-Select Chips */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-select {
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  background: var(--bg-chip);
  border: 1px solid transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 200ms var(--ease-out);
}
.chip-select:hover { background: var(--bg-chip-hover); }
.chip-select.selected {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(88,101,242,0.22);
}

/* Text Input */
.input-prompt {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-root);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.input-prompt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,101,242,0.10); }

/* Submit button for clarify */
.clarify-actions {
  margin-top: 18px;
  display: flex; justify-content: flex-end;
}

/* ============================================================
   TASK CARD
   ============================================================ */
.card-task {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  width: 100%;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  animation: fadeInUp 350ms var(--ease-out) both;
}
.card-task-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-task-icon { font-size: 18px; flex-shrink: 0; }
.card-task-title { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.ready   { background: var(--success); animation: breathe 2s ease-in-out infinite; }
.status-dot.blocked { background: var(--danger); }
.status-dot.needs_confirmation { background: var(--warning); animation: pulse 1.5s ease-in-out infinite; }
.card-task-divider { height: 1px; background: var(--border-card); margin: 0 20px; }
.card-task-body { padding: 16px 20px; }
.card-task-params {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px 12px;
  font-size: 13px;
}
.param-key   { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; }
.param-value { color: var(--text-primary); word-break: break-word; }
.card-task-footer {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border-card);
}

/* ============================================================
   CONFIRM CARD
   ============================================================ */
.card-confirm {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-left: 3px solid var(--warning);
  border-radius: var(--radius-lg);
  width: 100%;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  animation: fadeInUp 350ms var(--ease-out) both;
}
.card-confirm-header {
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.card-confirm-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.card-confirm-reason { font-size: 13px; color: var(--warning); font-weight: 600; }
.card-confirm-msg { font-size: 14px; color: var(--text-primary); margin-top: 4px; }
.card-confirm-payload { padding: 0 20px 16px; }
.card-confirm-footer {
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  border-top: 1px solid var(--border-card);
}

/* ── Shared card buttons ── */
.btn-primary {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: white;
  font-size: 13px;
  font-weight: 600;
  transition: background 150ms, transform 150ms, box-shadow 150ms;
  box-shadow: var(--shadow-glow);
}
.btn-primary:hover { background: #4F5CE6; transform: translateY(-1px); box-shadow: 0 4px 24px rgba(88,101,242,0.30); }
.btn-danger {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  background: var(--danger);
  color: white;
  font-size: 13px;
  font-weight: 600;
  transition: background 150ms, transform 150ms, box-shadow 150ms;
  box-shadow: var(--shadow-danger);
}
.btn-danger:hover { background: #DC2626; transform: translateY(-1px); }
.btn-ghost {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--border-card);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  transition: background 150ms, border-color 150ms, color 150ms;
}
.btn-ghost:hover { background: rgba(0,0,0,0.03); border-color: var(--border-hover); color: var(--text-primary); }

/* ── Risk badge ── */
.risk-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.risk-badge.low    { background: rgba(34,197,94,0.10); color: #16A34A; }
.risk-badge.medium { background: rgba(245,158,11,0.10); color: #D97706; }
.risk-badge.high   { background: rgba(239,68,68,0.10); color: #DC2626; animation: breathe 2s ease-in-out infinite; }

/* ── Status badge ── */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600;
}
.status-badge.ready   { background: rgba(34,197,94,0.10); color: #16A34A; }
.status-badge.needs_confirmation { background: rgba(245,158,11,0.10); color: #D97706; }
.status-badge.blocked { background: rgba(239,68,68,0.10); color: #DC2626; }

/* ============================================================
   TYPING INDICATOR
   ============================================================ */
.typing-indicator {
  display: flex; gap: 4px; padding: 6px 0;
  align-self: flex-start;
  animation: fadeInUp 200ms var(--ease-out) both;
}
.typing-indicator span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border-hover);
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

/* ============================================================
   TOAST
   ============================================================ */
#toast-container {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  color: white;
  animation: toastIn 300ms var(--ease-spring) both;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.toast.error { background: var(--danger); }
.toast.info  { background: var(--accent); }

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.55; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.30); }
  50%      { box-shadow: 0 0 8px 2px rgba(245,158,11,0.20); }
}
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30%           { transform: translateY(-6px); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#5865F2"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs></svg>
        <span>SigMA Copilot</span>
      </div>
    </div>
    <button class="btn-new-chat" id="btn-new-chat">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      新建会话
    </button>
    <div id="session-list"></div>
    <div class="sidebar-footer">
      <div class="avatar">U</div>
      <span>Demo User</span>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 5h10M4 9h10M4 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span class="topbar-title" id="topbar-title">SigMA Copilot</span>
      <div class="topbar-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="chat-area">
      <div class="welcome" id="welcome">
        <svg class="welcome-icon" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14" fill="url(#wg)"/>
          <defs><linearGradient id="wg" x1="0" y1="0" x2="56" y2="56"><stop stop-color="#5865F2"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
        </svg>
        <h2>您好，我是 SigMA Copilot</h2>
        <p>NVH 数据智能助手。可以帮你查询测试记录、导出 Excel、分析频谱数据。</p>
      </div>
    </div>

    <div id="input-area">
      <div class="input-wrapper">
        <textarea id="message-input" rows="1" placeholder="输入你的需求..." autofocus></textarea>
        <button class="btn-send" id="btn-send" disabled>
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 8l12-6L8 14l-2-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* ============================================================
   MaiaChat — Conversational AI Chat Engine
   ============================================================ */

const LS_KEY = 'maia_sessions';
const API_URL = '/turns';

/* ── DOM refs ── */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const chatArea   = $('#chat-area');
const msgInput   = $('#message-input');
const btnSend    = $('#btn-send');
const sessionList= $('#session-list');
const welcome    = $('#welcome');
const topbarTitle= $('#topbar-title');
const toastCont  = $('#toast-container');

/* ── State ── */
let state = loadState();
let typingEl = null;

/* ============================================================
   STORAGE
   ============================================================ */
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.sessions && parsed.activeId) return parsed;
    }
  } catch (_) {}
  return { sessions: {}, activeId: null, order: [] };
}
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}
function getActiveSession() {
  return state.activeId ? state.sessions[state.activeId] : null;
}

/* ============================================================
   SESSION MANAGEMENT
   ============================================================ */
function createSession() {
  const id = crypto.randomUUID();
  const now = new Date().toISOString();
  state.sessions[id] = { id, title: '新会话', createdAt: now, messages: [] };
  state.order.unshift(id);
  state.activeId = id;
  saveState();
  renderSidebar();
  showSession(id);
}

function deleteSession(id, e) {
  e.stopPropagation();
  delete state.sessions[id];
  state.order = state.order.filter(i => i !== id);
  if (state.activeId === id) {
    state.activeId = state.order[0] || null;
    if (state.activeId) showSession(state.activeId);
    else showWelcome();
  }
  saveState();
  renderSidebar();
}

function switchSession(id) {
  state.activeId = id;
  saveState();
  showSession(id);
}

function showSession(id) {
  const s = state.sessions[id];
  if (!s) return showWelcome();
  hideWelcome();
  topbarTitle.textContent = s.title || 'SigMA Copilot';
  chatArea.innerHTML = '';
  s.messages.forEach(m => appendMessage(m));
  scrollDown();
}

function showWelcome() {
  state.activeId = null;
  topbarTitle.textContent = 'SigMA Copilot';
  chatArea.innerHTML = '';
  chatArea.appendChild(welcome);
  welcome.style.display = '';
}

function hideWelcome() {
  welcome.style.display = 'none';
  if (welcome.parentNode) welcome.remove();
}

function renderSidebar() {
  sessionList.innerHTML = '';
  state.order.forEach(id => {
    const s = state.sessions[id];
    const div = document.createElement('div');
    div.className = 'session-item' + (id === state.activeId ? ' active' : '');
    div.innerHTML = `
      <span class="session-title">${escHtml(s.title)}</span>
      <span class="session-time">${timeAgo(s.createdAt)}</span>
      <button class="btn-delete-session" title="删除">×</button>
    `;
    div.querySelector('.session-title').onclick = () => switchSession(id);
    div.querySelector('.btn-delete-session').onclick = (e) => deleteSession(id, e);
    sessionList.appendChild(div);
  });
}

/* ============================================================
   MESSAGE SENDING
   ============================================================ */
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  let session = getActiveSession();
  if (!session) {
    createSession();
    session = getActiveSession();
  }
  hideWelcome();

  // Optimistic: add user message
  const userMsg = { role: 'user', text, ts: Date.now() };
  session.messages.push(userMsg);
  if (!session.title || session.title === '新会话') {
    session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  }
  saveState();
  appendMessage(userMsg);
  renderSidebar();
  topbarTitle.textContent = session.title;

  msgInput.value = '';
  msgInput.style.height = 'auto';
  btnSend.disabled = true;

  // Typing indicator
  showTyping();

  // Build prompt_replies only if last bot message was a clarify plan
  const lastBot = [...session.messages].reverse().find(m => m.role === 'bot');
  const needsReplies = lastBot && lastBot.plan && lastBot.plan.kind === 'clarify' && lastBot.plan.prompts && lastBot.plan.prompts.length > 0;
  const promptReplies = needsReplies ? collectPromptReplies() : [];

  try {
    const body = {
      session_id: session.id,
      message: text,
      workspace_context: { lang: 'zh' }
    };
    if (needsReplies) body.prompt_replies = promptReplies;
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    hideTyping();

    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const botMsg = { role: 'bot', plan: data.plan, ts: Date.now() };
    session.messages.push(botMsg);
    saveState();
    appendMessage(botMsg);

    // Update title from first meaningful exchange
    if (session.messages.length <= 2) {
      session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
      saveState();
    }

  } catch (err) {
    hideTyping();
    toast(err.message || '请求失败', 'error');
  }

  scrollDown();
}

function collectPromptReplies() {
  const replies = [];
  const cards = document.querySelectorAll('.card-clarify');
  const card = cards[cards.length - 1];
  if (!card) return replies;
  card.querySelectorAll('.prompt-section[data-prompt-id]').forEach(el => {
    const id = el.dataset.promptId;
    const type = el.dataset.inputType;
    if (type === 'single_select') {
      const sel = el.querySelector('.option-card.selected');
      if (sel) replies.push({ prompt_id: id, value: parseValue(sel.dataset.value) });
    } else if (type === 'multi_select') {
      const vals = [];
      el.querySelectorAll('.chip-select.selected').forEach(c => vals.push(parseValue(c.dataset.value)));
      if (vals.length) replies.push({ prompt_id: id, value: vals });
    } else if (type === 'text') {
      const inp = el.querySelector('.input-prompt');
      if (inp && inp.value.trim()) replies.push({ prompt_id: id, value: inp.value.trim() });
    }
  });
  return replies;
}

/* ============================================================
   TYPING INDICATOR
   ============================================================ */
function showTyping() {
  hideTyping();
  typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(typingEl);
  scrollDown();
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

/* ============================================================
   MESSAGE RENDERING
   ============================================================ */
function appendMessage(msg) {
  const el = document.createElement('div');
  if (msg.role === 'user') {
    renderUser(el, msg);
  } else if (msg.plan) {
    renderPlan(el, msg.plan);
  }
  chatArea.appendChild(el);
  scrollDown();
}

function renderUser(el, msg) {
  el.className = 'msg user';
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>YOU</div>
    <div class="bubble-user">${escHtml(msg.text)}</div>
  `;
}

function renderPlan(el, plan) {
  switch (plan.kind) {
    case 'reply':          renderReply(el, plan); break;
    case 'clarify':        renderClarify(el, plan); break;
    case 'task':           renderTask(el, plan); break;
    case 'confirm':        renderConfirm(el, plan); break;
    case 'context_update': renderContextUpdate(el, plan); break;
    case 'context_clear':  renderContextClear(el, plan); break;
    default:               renderFallback(el, plan);
  }
}

/* ── Reply ── */
function renderReply(el, plan) {
  el.className = 'msg bot';
  const msgHtml = plan.message ? `<div class="bot-text">${escHtml(plan.message)}</div>` : '';
  let sugHtml = '';
  if (plan.suggestions && plan.suggestions.length) {
    sugHtml = '<div class="suggestions">' +
      plan.suggestions.map(s => `<button class="chip" onclick="quickReply(this)">${escHtml(s)}</button>`).join('') +
      '</div>';
  }
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    ${msgHtml}
    ${sugHtml}
  `;
}

/* ── Clarify ── */
function renderClarify(el, plan) {
  // Clear any stale selections from previous clarify cards
  document.querySelectorAll('.card-clarify .option-card.selected, .card-clarify .chip-select.selected').forEach(c => c.classList.remove('selected'));
  el.className = 'msg bot';
  const promptsHtml = (plan.prompts || []).map(p => buildPromptCard(p)).join('');
  const pendingHtml = plan.pending_task ? `<div style="margin-top:8px;font-size:12px;color:var(--text-tertiary)">待执行: ${escHtml(plan.pending_task)}</div>` : '';

  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    <div class="card-clarify">
      <div class="card-clarify-header">
        <span class="card-clarify-icon">📋</span>
        <div>
          <div class="card-clarify-reason">${reasonLabel(plan.reason)}</div>
          <div class="card-clarify-msg">${escHtml(plan.message)}</div>
          ${pendingHtml}
        </div>
      </div>
      ${promptsHtml}
      <div class="clarify-actions">
        <button class="btn-primary" onclick="submitClarify(this)">确认选择</button>
      </div>
    </div>
  `;
}

function buildPromptCard(prompt) {
  let body = '';
  if (prompt.input_type === 'single_select') {
    body = `
      <div class="option-cards">
        ${(prompt.candidates || []).map(c => `
          <div class="option-card${c.disabled ? ' disabled' : ''}" data-value="${jsonAttr(c.value)}" onclick="selectOption(this)" ${c.disabled ? 'aria-disabled="true"' : ''}>
            <div class="option-card-value">${escHtml(c.label)}</div>
            ${c.description ? `<div class="option-card-desc">${escHtml(c.description)}</div>` : ''}
            <div class="option-card-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        `).join('')}
      </div>`;
  } else if (prompt.input_type === 'multi_select') {
    body = `
      <div class="chip-group">
        ${(prompt.candidates || []).map(c => `
          <button class="chip-select" data-value="${jsonAttr(c.value)}" onclick="toggleChip(this)">${escHtml(c.label)}</button>
        `).join('')}
      </div>`;
  } else {
    body = `<input class="input-prompt" type="text" placeholder="${escAttr(prompt.message)}">`;
  }
  return `
    <div class="prompt-section" data-prompt-id="${escAttr(prompt.id)}" data-input-type="${escAttr(prompt.input_type)}">
      <div class="prompt-label">${escHtml(prompt.label)} ${prompt.required ? '<span class="prompt-required">*必填</span>' : ''}</div>
      ${body}
    </div>`;
}

/* ── Task ── */
function renderTask(el, plan) {
  el.className = 'msg bot';
  const paramsHtml = Object.entries(plan.params || {}).map(([k, v]) => `
    <div class="param-key">${escHtml(k)}</div>
    <div class="param-value">${escHtml(formatParam(v))}</div>
  `).join('');

  const needsConfirm = plan.requires_confirmation || plan.status === 'needs_confirmation';
  const footerHtml = needsConfirm
    ? `<div class="card-task-footer">
        <span class="risk-badge ${plan.risk_level || 'low'}">${plan.risk_level || 'low'} risk</span>
        <div style="display:flex;gap:10px;">
          <button class="btn-ghost" onclick="dismissCard(this)">取消 (N)</button>
          <button class="btn-primary" onclick="confirmTask(this)">▶ 确认 (Y)</button>
        </div>
      </div>`
    : `<div class="card-task-footer">
        <span class="risk-badge ${plan.risk_level || 'low'}">${plan.risk_level || 'low'} risk</span>
        <button class="btn-primary" onclick="dismissCardVisual(this)">已了解</button>
      </div>`;

  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    <div class="card-task">
      <div class="card-task-header">
        <span class="card-task-icon">⚡</span>
        <span class="card-task-title">${escHtml(plan.title || plan.name)}</span>
        <span class="status-dot ${plan.status}"></span>
        <span class="status-badge ${plan.status}">${statusLabel(plan.status)}</span>
      </div>
      <div class="card-task-divider"></div>
      <div class="card-task-body">
        <div class="card-task-params">${paramsHtml}</div>
        ${plan.message ? `<div style="margin-top:12px;font-size:13px;color:var(--text-secondary)">${escHtml(plan.message)}</div>` : ''}
      </div>
      ${footerHtml}
    </div>
  `;
}

/* ── Confirm ── */
function renderConfirm(el, plan) {
  el.className = 'msg bot';
  const payloadHtml = plan.payload ? `<pre style="margin-top:8px;font-size:12px;color:var(--text-tertiary);white-space:pre-wrap;">${escHtml(JSON.stringify(plan.payload, null, 2))}</pre>` : '';

  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    <div class="card-confirm">
      <div class="card-confirm-header">
        <span class="card-confirm-icon">⚠️</span>
        <div>
          <div class="card-confirm-reason">${escHtml(plan.reason)}</div>
          <div class="card-confirm-msg">${escHtml(plan.message)}</div>
        </div>
      </div>
      <div class="card-confirm-payload">${payloadHtml}</div>
      <div class="card-confirm-footer">
        <button class="btn-ghost" onclick="dismissCard(this)">取消</button>
        <button class="btn-danger" onclick="confirmAction(this)">确认执行</button>
      </div>
    </div>
  `;
}

/* ── Context ── */
function renderContextUpdate(el, plan) {
  el.className = 'msg-system';
  el.innerHTML = `
    <div class="msg-system-line"></div>
    <div>${escHtml(plan.message || 'Context updated.')}</div>
  `;
}
function renderContextClear(el, plan) {
  el.className = 'msg-system';
  el.innerHTML = `
    <div class="msg-system-line"></div>
    <div>${escHtml(plan.message || 'Context cleared.')}</div>
  `;
}
function renderFallback(el, plan) {
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="msg-role"><span class="msg-role-dot"></span>COPILOT</div>
    <div class="bot-text">${escHtml(JSON.stringify(plan, null, 2))}</div>
  `;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function quickReply(btn) {
  const text = btn.textContent;
  btn.closest('.msg').querySelectorAll('.chip').forEach(c => c.disabled = true);
  msgInput.value = text;
  sendMessage();
}

function selectOption(el) {
  if (el.classList.contains('disabled')) return;
  const group = el.closest('.option-cards');
  group.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function toggleChip(el) {
  el.classList.toggle('selected');
}

function submitClarify(btn) {
  btn.disabled = true;
  btn.textContent = '已提交';
  const replies = collectPromptReplies();
  // Send a synthetic message with the replies
  const session = getActiveSession();
  if (!session) return;
  const promptMsg = replies.map(r => `${r.prompt_id}: ${Array.isArray(r.value) ? r.value.join(', ') : r.value}`).join('; ');
  msgInput.value = `[已选择] ${promptMsg}`;
  sendMessage();
}

function dismissCard(btn) {
  disableCardButtons(btn);
  btn.textContent = '已取消';
  msgInput.value = 'N';
  sendMessage();
}

function dismissCardVisual(btn) {
  disableCardButtons(btn);
  btn.textContent = '已了解';
}

function confirmTask(btn) {
  disableCardButtons(btn);
  btn.textContent = '已确认';
  msgInput.value = 'Y';
  sendMessage();
}

function confirmAction(btn) {
  disableCardButtons(btn);
  btn.textContent = '已确认';
  msgInput.value = 'Y';
  sendMessage();
}

function disableCardButtons(btn) {
  const footer = btn.closest('.card-task-footer, .card-confirm-footer');
  if (footer) footer.querySelectorAll('button').forEach(b => b.disabled = true);
}

/* ── Scroll ── */
function scrollDown() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

/* ── Toast ── */
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  toastCont.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(40px)';
    el.style.transition = 'all 200ms ease-in';
    setTimeout(() => el.remove(), 250);
  }, 3000);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function jsonAttr(v) {
  return escAttr(typeof v === 'object' && v !== null ? JSON.stringify(v) : String(v));
}
function parseValue(raw) {
  if (!raw) return raw;
  try { return JSON.parse(raw); } catch (_) { return raw; }
}
function formatParam(v) {
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(', ');
  if (typeof v === 'object' && v !== null) return JSON.stringify(v);
  return String(v);
}
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins}分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}小时前`;
  return `${Math.floor(hrs / 24)}天前`;
}
function reasonLabel(r) {
  const map = {
    low_confidence: '低置信度',
    ambiguous_intent: '意图模糊',
    missing_slots: '缺少信息',
    invalid_slots: '无效参数',
    ambiguous_slots: '参数歧义'
  };
  return map[r] || r;
}
function statusLabel(s) {
  const map = { ready: '就绪', needs_confirmation: '需确认', blocked: '阻塞' };
  return map[s] || s;
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
btnSend.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener('input', () => {
  btnSend.disabled = !msgInput.value.trim();
  // Auto-resize
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

$('#btn-new-chat').addEventListener('click', createSession);
$('#btn-toggle-sidebar').addEventListener('click', () => {
  $('#sidebar').classList.toggle('collapsed');
});

// Click outside sidebar to close on mobile
chatArea.addEventListener('click', () => {
  if (window.innerWidth < 768) $('#sidebar').classList.add('collapsed');
});

/* ============================================================
   INIT
   ============================================================ */
if (state.activeId && state.sessions[state.activeId]) {
  showSession(state.activeId);
} else if (state.order.length > 0) {
  state.activeId = state.order[0];
  showSession(state.activeId);
} else {
  showWelcome();
}
renderSidebar();
</script>
